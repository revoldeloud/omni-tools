name: Vendor OpenReel source into Utitools

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/openreel-sync.yml

permissions:
  contents: write

jobs:
  vendor-openreel:
    if: github.event.head_commit.message == 'vendor OpenReel into Utitools'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Utitools
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vendor and adapt OpenReel source
        run: bash scripts/vendor-openreel.sh
      - name: Commit integrated application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/openreel
          if git diff --cached --quiet; then
            echo "OpenReel source is already current."
            exit 0
          fi
          git commit -m "vendor: add OpenReel source to Utitools"
          git push origin main
# bootstrap-version: 2
